AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Voting monolith on a single EC2 instance with a security group for SSH, HTTP,
  and HTTPS. User data downloads deploy/userdata.sh from your GitHub fork and
  runs it (edit REPO_URL there and push before creating the stack).

Parameters:
  GitHubUsername:
    Type: String
    Description: >-
      Your GitHub username. The stack downloads
      https://raw.githubusercontent.com/<username>/voting_monolith/main/deploy/userdata.sh
      Push your REPO_URL edit to main before you create the stack.
    AllowedPattern: "^[A-Za-z0-9](?:[A-Za-z0-9]|-(?=[A-Za-z0-9])){0,38}$"
    ConstraintDescription: A GitHub username (letters, numbers, hyphens).

Resources:
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Voting monolith - SSH, HTTP, and HTTPS
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS
      Tags:
        - Key: Name
          Value: voting-monolith-web

  VotingInstance:
    Type: AWS::EC2::Instance
    Properties:
      # Current Amazon Linux 2023 AMI in this region (x86_64).
      ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      InstanceType: t3.micro
      KeyName: vockey
      SecurityGroupIds:
        - !GetAtt WebSecurityGroup.GroupId
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/${GitHubUsername}/voting_monolith/main/deploy/userdata.sh" \
            -o /tmp/voting-userdata.sh
          bash /tmp/voting-userdata.sh
      Tags:
        - Key: Name
          Value: voting-monolith

Outputs:
  PublicIP:
    Description: Public IPv4 address of the instance
    Value: !GetAtt VotingInstance.PublicIp
